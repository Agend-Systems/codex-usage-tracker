name: Build and test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      build: ${{ steps.release_metadata.outputs.build }}
      version: ${{ steps.release_metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.0.1
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
      - name: Lint
        run: xcrun swift-format lint --strict --recursive .
      - name: Build Debug
        run: >-
          xcodebuild -project "Codex Usage.xcodeproj" -scheme "Codex Usage"
          -configuration Debug -derivedDataPath "$RUNNER_TEMP/codex-usage-debug"
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          SWIFT_STRICT_CONCURRENCY=complete build
      - name: Test
        run: >-
          xcodebuild -project "Codex Usage.xcodeproj" -scheme "Codex Usage"
          -configuration Debug -derivedDataPath "$RUNNER_TEMP/codex-usage-debug"
          -destination "platform=macOS"
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          SWIFT_STRICT_CONCURRENCY=complete test
      - name: Build Release
        run: >-
          xcodebuild -project "Codex Usage.xcodeproj" -scheme "Codex Usage"
          -configuration Release -derivedDataPath "$RUNNER_TEMP/codex-usage-release"
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          SWIFT_STRICT_CONCURRENCY=complete build
      - name: Read release metadata
        id: release_metadata
        run: |
          info_plist="$RUNNER_TEMP/codex-usage-release/Build/Products/Release/Codex Usage.app/Contents/Info.plist"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info_plist")"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info_plist")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          if [[ ! "$build" =~ ^[0-9]+$ ]]; then
            echo "Invalid build number: $build" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - name: Package release artifact
        run: |
          app_path="$RUNNER_TEMP/codex-usage-release/Build/Products/Release/Codex Usage.app"
          test -d "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "Codex Usage.app.zip"
          shasum -a 256 "Codex Usage.app.zip" > "Codex Usage.app.zip.sha256"
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-usage-${{ github.run_id }}
          path: |
            Codex Usage.app.zip
            Codex Usage.app.zip.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'push'
    needs: macos
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Plan release
        id: release
        env:
          BUILD: ${{ needs.macos.outputs.build }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.macos.outputs.version }}
        run: |
          expected_tag="v${VERSION}"
          release_tag="$expected_tag"

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $VERSION (build $BUILD)." >&2
            exit 1
          fi

          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; this commit will keep its CI artifact only."
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif tag_ref_sha="$(gh api "repos/${GH_REPO}/git/ref/tags/${release_tag}" --jq '.object.sha' 2>/dev/null)"; then
            if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
              tag_type="$(gh api "repos/${GH_REPO}/git/ref/tags/${release_tag}" --jq '.object.type')"
              if [[ "$tag_type" == "tag" ]]; then
                tag_ref_sha="$(gh api "repos/${GH_REPO}/git/tags/${tag_ref_sha}" --jq '.object.sha')"
              fi
              if [[ "$tag_ref_sha" != "$GITHUB_SHA" ]]; then
                echo "Tag $release_tag exists on another commit but has no GitHub release." >&2
                exit 1
              fi
            fi
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "create_tag=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.release.outputs.publish == 'true'
      - name: Download release artifact
        if: steps.release.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: codex-usage-${{ github.run_id }}
          path: unsigned-artifact
      - name: Require signing credentials
        if: steps.release.outputs.publish == 'true'
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          missing=()
          for name in \
            APPLE_API_ISSUER_ID \
            APPLE_API_KEY_ID \
            APPLE_API_KEY_P8_BASE64 \
            MACOS_CERTIFICATE_P12_BASE64 \
            MACOS_CERTIFICATE_PASSWORD
          do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required release secrets: ${missing[*]}" >&2
            exit 1
          fi
      - name: Import Developer ID certificate
        if: steps.release.outputs.publish == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/codex-usage-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" \
            | awk '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "$signing_identity" ]]; then
            echo "The certificate does not contain a Developer ID Application identity." >&2
            exit 1
          fi
          echo "SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
      - name: Sign app with Developer ID
        if: steps.release.outputs.publish == 'true'
        run: |
          signed_app_directory="$RUNNER_TEMP/signed-app"
          ditto -x -k "unsigned-artifact/Codex Usage.app.zip" "$signed_app_directory"
          app_path="$signed_app_directory/Codex Usage.app"
          test -d "$app_path"

          codesign --force \
            --options runtime \
            --timestamp \
            --entitlements "Codex Usage/CodexUsageTracker.entitlements" \
            --sign "$SIGNING_IDENTITY" \
            --keychain "$SIGNING_KEYCHAIN" \
            "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
      - name: Notarize and staple app
        if: steps.release.outputs.publish == 'true'
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          app_path="$RUNNER_TEMP/signed-app/Codex Usage.app"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          notarization_upload="$RUNNER_TEMP/Codex Usage.notarization.zip"

          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$api_key_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$notarization_upload"
          xcrun notarytool submit "$notarization_upload" \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$app_path"
          xcrun stapler validate "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
      - name: Package notarized release
        if: steps.release.outputs.publish == 'true'
        run: |
          app_path="$RUNNER_TEMP/signed-app/Codex Usage.app"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "Codex Usage.app.zip"
          shasum -a 256 "Codex Usage.app.zip" > "Codex Usage.app.zip.sha256"
      - name: Create annotated version tag
        if: steps.release.outputs.create_tag == 'true'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          tag_object_sha="$(gh api --method POST "repos/${GH_REPO}/git/tags" \
            -f tag="$RELEASE_TAG" \
            -f message="Codex Usage $RELEASE_TAG" \
            -f object="$GITHUB_SHA" \
            -f type="commit" \
            --jq '.sha')"
          gh api --method POST "repos/${GH_REPO}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" \
            -f sha="$tag_object_sha"
      - name: Publish GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: >-
          gh release create "$RELEASE_TAG"
          "Codex Usage.app.zip" "Codex Usage.app.zip.sha256"
          --generate-notes --title "Codex Usage $RELEASE_TAG"
      - name: Remove signing credentials
        if: always() && steps.release.outputs.publish == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          security delete-keychain "$RUNNER_TEMP/codex-usage-signing.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/developer-id-application.p12" \
            "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
