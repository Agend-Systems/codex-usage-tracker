name: Build and test

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: >-
          xcodebuild -project "Codex Usage.xcodeproj" -scheme "Codex Usage"
          -configuration Debug -derivedDataPath "$RUNNER_TEMP/codex-usage-derived"
          CODE_SIGNING_ALLOWED=NO build
      - name: Test
        run: >-
          xcodebuild -project "Codex Usage.xcodeproj" -scheme "Codex Usage"
          -configuration Debug -derivedDataPath "$RUNNER_TEMP/codex-usage-derived"
          CODE_SIGNING_ALLOWED=NO test
